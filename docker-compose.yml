# Local container runs. Neither service is used by Vercel.
#
# This file owns the host ports. scripts/docker.mjs reads them from here via
# `docker compose config`, so change a port below and nothing else needs
# touching.
#
#   npm run docker:dev    -> hot reload
#   npm run docker:prod   -> production bundle

services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Anonymous volume: keeps the image's Linux node_modules, hides the host's.
      - /app/node_modules
    environment:
      VITE_POLLING: "1"

  prod:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
